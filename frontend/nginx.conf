server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------
    # Content Security Policy
    # ---------------------------------------------------------------------
    # 카카오맵 SDK 와 카카오 OAuth 가 정상 동작하려면 다음 도메인이 필요하다.
    # - script-src       : dapi.kakao.com (지도 SDK), t1.daumcdn.net (보조 스크립트)
    # - img-src          : *.daumcdn.net / *.kakaocdn.net (지도 타일·마커, 프로필 이미지)
    # - connect-src      : kauth/kapi/dapi.kakao.com (OAuth + 카카오 REST API)
    # - frame-src        : kauth.kakao.com (간편 로그인 팝업/iframe)
    #
    # 'unsafe-eval' 은 의도적으로 포함하지 않는다.
    #   · recharts 는 eval 을 사용하지 않는다.
    #   · dev 빌드를 운영에 올리지 않으면 eval 자체가 발생하지 않는다.
    #   · XSS 노출 위험이 크기 때문에 가능한 한 허용하지 말 것.
    #
    # 'unsafe-inline' (script) 는 PWA 부트스트랩 인라인 코드 때문에 일단 허용.
    #    엄격 모드로 전환하려면 nonce/sha256 방식 도입 필요.
    # ---------------------------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; \
script-src 'self' 'unsafe-inline' https://dapi.kakao.com https://t1.daumcdn.net https://js.tosspayments.com; \
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; \
font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; \
img-src 'self' data: blob: https://*.daumcdn.net https://*.kakaocdn.net https://t1.daumcdn.net https://k.kakaocdn.net; \
connect-src 'self' https://dapi.kakao.com https://kauth.kakao.com https://kapi.kakao.com https://api.tosspayments.com; \
frame-src https://kauth.kakao.com https://*.tosspayments.com; \
worker-src 'self' blob:; \
manifest-src 'self'; \
object-src 'none'; \
base-uri 'self'" always;

    # 보조 보안 헤더
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # SPA 라우팅 — 모든 경로를 index.html 로 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JS/CSS/이미지 등 정적 자산 — 1년 캐시
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 과 Service Worker 는 캐시 금지 (항상 최신 버전 요구)
    location ~* (index\.html|sw\.js|workbox-.*)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
